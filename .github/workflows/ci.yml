name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check if lint script exists
        id: check_lint
        run: |
          if npm run | grep -q "  lint"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Run ESLint
        if: steps.check_lint.outputs.exists == 'true'
        run: npm run lint
      
      - name: Check if format:check script exists
        id: check_format
        run: |
          if npm run | grep -q "  format:check"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Check Prettier formatting
        if: steps.check_format.outputs.exists == 'true'
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check if test script exists
        id: check_test
        run: |
          if npm run | grep -q "  test"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Run tests
        if: steps.check_test.outputs.exists == 'true'
        run: npm test -- --coverage --watchAll=false
      
      - name: Upload coverage to Codecov
        if: steps.check_test.outputs.exists == 'true' && always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build tokens
        run: npm run build:tokens
      
      - name: Build library
        run: npm run build
      
      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.esm.js" ]; then
            echo "Build failed: ESM bundle not found"
            exit 1
          fi
          if [ ! -f "dist/index.cjs.js" ]; then
            echo "Build failed: CJS bundle not found"
            exit 1
          fi
          if [ ! -f "dist/styles.css" ]; then
            echo "Build failed: CSS bundle not found"
            exit 1
          fi
          echo "Build successful!"

  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check if test:a11y script exists
        id: check_a11y
        run: |
          if npm run | grep -q "  test:a11y"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Run accessibility tests
        if: steps.check_a11y.outputs.exists == 'true'
        run: npm run test:a11y -- --watchAll=false

